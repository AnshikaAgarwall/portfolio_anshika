<!doctype html>
<!-- HTML shell Vite serves. Preloads the two self-hosted fonts and the hero
     cutout (the LCP image), declares favicon + manifest, and mounts React.
     Per-page title/description/OG/canonical tags are set by <Seo />. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Anshika Agarwal, full-stack developer. MERN, React, Node.js and Django." />
    <meta name="theme-color" content="#0A0A0A" />
    <title>Anshika Agarwal | Full-Stack Developer</title>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts used above the fold (variable, so each file covers all weights) -->
    <link rel="preload" href="/fonts/inter-tight-var-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-var-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Hero cutout = LCP image. Same srcset/sizes as the <picture> in Hero.jsx. -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      fetchpriority="high"
      imagesrcset="/images/anshika-cutout-480.webp 480w, /images/anshika-cutout-800.webp 800w, /images/anshika-cutout-1200.webp 1200w"
      imagesizes="(min-width: 768px) 40vw, 85vw"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
